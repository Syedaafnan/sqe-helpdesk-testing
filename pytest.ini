[pytest]
# Team test configuration (SE3002). Upstream tests use the Django runner via quicktest.py.
DJANGO_SETTINGS_MODULE = demodesk.config.settings
testpaths = tests/team
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: white-box unit tests (no database)
    api: API and integration tests
    recovery: controlled failure-and-recovery tests
    e2e: Playwright end-to-end tests against the running demo site
filterwarnings =
    ignore::DeprecationWarning
